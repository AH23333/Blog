<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #1a1a1a;
      color: #ccc;
      font-family: monospace;
    }

    .screen {
      filter: url(#crt-barrel);
      background: #111;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(20, 1fr);
      gap: 0;
      height: 600px;
    }

    .line {
      border-left: 1px solid rgba(255, 255, 255, 0.3);
      height: 100%;
    }

    /* 水平网格线 */
    .hline {
      position: absolute;
      left: 0;
      right: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* 文字标记 */
    .marker-l {
      position: absolute;
      left: 4%;
      top: 18%;
      color: #ff4444;
      font-size: 18px;
      font-weight: bold;
    }

    .marker-c {
      position: absolute;
      left: 47%;
      top: 18%;
      color: #ffff44;
      font-size: 18px;
      font-weight: bold;
    }

    .marker-r {
      position: absolute;
      left: 90%;
      top: 18%;
      color: #44ffff;
      font-size: 18px;
      font-weight: bold;
    }

    .marker-t {
      position: absolute;
      left: 47%;
      top: 4%;
      color: #44ff44;
      font-size: 18px;
      font-weight: bold;
    }

    .marker-b {
      position: absolute;
      left: 47%;
      top: 88%;
      color: #ff8844;
      font-size: 18px;
      font-weight: bold;
    }

    .marker-tl {
      position: absolute;
      left: 4%;
      top: 4%;
      color: #ff44ff;
      font-size: 14px;
    }

    .marker-tr {
      position: absolute;
      left: 90%;
      top: 4%;
      color: #ff44ff;
      font-size: 14px;
    }

    .marker-bl {
      position: absolute;
      left: 4%;
      top: 88%;
      color: #ff44ff;
      font-size: 14px;
    }

    .marker-br {
      position: absolute;
      left: 90%;
      top: 88%;
      color: #ff44ff;
      font-size: 14px;
    }

    .title {
      color: #888;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .title span {
      color: #0f0;
    }

    .desc {
      color: #666;
      font-size: 12px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  <div class="title">鱼眼/枕形畸变测试 <span>(pincushion distortion)</span></div>
  <div class="desc">预期效果：四角内容向外拉伸，呈现鱼眼透视效果</div>
  <svg style="position:absolute;width:0;height:0;overflow:hidden">
    <filter id="crt-barrel" filterUnits="userSpaceOnUse" x="-80" y="-80" width="2000" height="2000">
      <feImage id="crt-barrel-disp" href="" result="dispMap" x="-80" y="-80" width="2000" height="2000"
        preserveAspectRatio="none" />
      <feDisplacementMap in="SourceGraphic" in2="dispMap" scale="70" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <div class="screen" style="width:1200px;height:700px;">
    <div class="grid" id="grid"></div>
    <!-- 水平网格线 -->
    <div class="hline" style="top:10%"></div>
    <div class="hline" style="top:25%"></div>
    <div class="hline" style="top:50%"></div>
    <div class="hline" style="top:75%"></div>
    <div class="hline" style="top:90%"></div>
    <!-- 标记 -->
    <span class="marker-l">| LEFT</span>
    <span class="marker-c">| CENTER</span>
    <span class="marker-r">| RIGHT</span>
    <span class="marker-t">― TOP</span>
    <span class="marker-b">― BOTTOM</span>
    <span class="marker-tl">TL</span>
    <span class="marker-tr">TR</span>
    <span class="marker-bl">BL</span>
    <span class="marker-br">BR</span>
  </div>
  <script>
    // 生成垂直网格线
    var grid = document.getElementById('grid');
    for (var i = 0; i < 20; i++) {
      var div = document.createElement('div');
      div.className = 'line';
      grid.appendChild(div);
    }

    // 生成鱼眼/枕形畸变位移映射图
    // 公式：dx = -xn * (1 - yn²), dy = -yn * (1 - xn²)
    var canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    var ctx = canvas.getContext('2d');

    var imageData = ctx.createImageData(256, 256);
    var data = imageData.data;

    for (var y = 0; y < 256; y++) {
      var yn = (y - 128) / 128;
      var yn2 = yn * yn;
      for (var x = 0; x < 256; x++) {
        var xn = (x - 128) / 128;
        var xn2 = xn * xn;

        var dx = -xn * (1 - yn2);
        var dy = -yn * (1 - xn2);

        var r = Math.round(128 + dx * 127);
        var g = Math.round(128 + dy * 127);

        var idx = (y * 256 + x) * 4;
        data[idx] = Math.max(0, Math.min(255, r));
        data[idx + 1] = Math.max(0, Math.min(255, g));
        data[idx + 2] = 128;
        data[idx + 3] = 255;
      }
    }

    ctx.putImageData(imageData, 0, 0);

    var dataUrl = canvas.toDataURL('image/png');
    var feImage = document.getElementById('crt-barrel-disp');
    var filter = document.getElementById('crt-barrel');
    var screen = document.querySelector('.screen');

    feImage.setAttribute('href', dataUrl);
    feImage.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', dataUrl);

    // Set filter dimensions to cover the screen element
    var pad = 80;
    var w = Math.max(screen.scrollWidth, 1200) + pad * 2;
    var h = Math.max(screen.scrollHeight, 700) + pad * 2;
    filter.setAttribute('x', String(-pad));
    filter.setAttribute('y', String(-pad));
    filter.setAttribute('width', String(w));
    filter.setAttribute('height', String(h));
    feImage.setAttribute('x', String(-pad));
    feImage.setAttribute('y', String(-pad));
    feImage.setAttribute('width', String(w));
    feImage.setAttribute('height', String(h));
  </script>
</body>

</html>
